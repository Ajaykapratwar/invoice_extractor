[project]
name = "invoice-extractor-nlp"
version = "0.2.0"
description = "Invoice extraction using spaCy NLP and NER with Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "pandas",
    "pymupdf",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
